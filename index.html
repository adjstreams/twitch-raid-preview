<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raid Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:transparent;
font-family:Arial, Helvetica, sans-serif;
}

#stage{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}

/* preview container */

#preview-shell{

position:absolute;

right:40px;
top:40px;

width:640px;
height:360px;

transform-origin:center;
/* Twitch checks the visible size before allowing autoplay. */
transform:scale(1);

transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}

/* video frame */

#preview{

position:absolute;
inset:0;

border-radius:18px;
overflow:hidden;

background:black;

box-shadow:0 30px 80px rgba(0,0,0,.6);

transition:border-radius .6s ease;

}

#player{
width:100%;
height:100%;
}

/* raid banner */

#raid-banner{

position:absolute;

left:0;
top:100%;
margin-top:4px;

padding:6px 12px;

background:rgba(0,0,0,.65);
color:white;

font-size:18px;
font-weight:600;

border-radius:8px;

pointer-events:none;

z-index:10;

}

</style>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>

</head>
<body>

<div id="stage">

<div id="preview-shell">

<div id="preview">
<div id="player"></div>
</div>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search)

const channel=params.get("channel") || "adjstreams"
const delay=parseFloat(params.get("delay") || "69")
const duration=parseFloat(params.get("duration") || "10")
const spawnDelay=parseFloat(params.get("spawnDelay") || "1")
const parentParam = params.get("parent")
const build="obs-test-4"
let statusLabel
if(params.has("debug")){
statusLabel=document.createElement("div")
statusLabel.style.cssText="position:absolute;left:12px;top:12px;color:white;background:#222;padding:8px;font:16px Arial;pointer-events:none"
document.getElementById("stage").appendChild(statusLabel)
statusLabel.textContent=`${build}: loading`
}
const shell=document.getElementById("preview-shell")
const preview=document.getElementById("preview")
const parent = parentParam
  ? parentParam.split(",")
  : [location.hostname]


/* Twitch player */

const player=new Twitch.Player("player",{

channel:channel,
width:"100%",
height:"100%",
parent:parent,
autoplay:true,
muted:false

})

for(const event of [Twitch.Player.READY,Twitch.Player.PLAYING,Twitch.Player.PAUSE,Twitch.Player.PLAYBACK_BLOCKED,Twitch.Player.OFFLINE]){
player.addEventListener(event,()=>{
console.log(build,event)
if(statusLabel) statusLabel.textContent=`${build}: ${event}`
})
}

let presentationStarted=false

player.addEventListener(Twitch.Player.PLAYING,()=>{

/* Do not switch mute state during playback: that can trigger an autoplay pause. */

if(presentationStarted) return
presentationStarted=true

/* Keep the banner below the video so it does not interrupt Twitch autoplay. */
const banner=document.createElement("div")
banner.id="raid-banner"
banner.textContent=`Raiding ${channel}`
shell.appendChild(banner)

/* fullscreen animation */

setTimeout(()=>{

const rect=shell.getBoundingClientRect()
banner.remove()

const scaleX=window.innerWidth/rect.width
const scaleY=window.innerHeight/rect.height

const scale=Math.max(scaleX,scaleY)

shell.style.transition=`
transform ${duration}s cubic-bezier(.22,1.15,.36,1),
right ${duration}s cubic-bezier(.22,1.15,.36,1),
top ${duration}s cubic-bezier(.22,1.15,.36,1)
`

shell.style.right="50%"
shell.style.top="50%"

shell.style.transform=`translate(50%,-50%) scale(${scale})`

preview.style.borderRadius="0px"

},delay*1000)

})

player.addEventListener(Twitch.Player.PLAYBACK_BLOCKED,()=>{
console.warn("Twitch blocked playback. Check OBS browser-source autoplay permissions.")
})

</script>

</body>
</html>
